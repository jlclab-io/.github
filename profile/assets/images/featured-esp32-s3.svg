<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">ESP32-S3 Development Platform</title>
<desc id="svg-desc">Stylized ESP32-S3 wireless MCU development card. The illustration is not an exact PCB layout or product photograph.</desc>
<defs>
